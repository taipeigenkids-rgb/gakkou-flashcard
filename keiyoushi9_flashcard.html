<style>
  * { box-sizing: border-box; }
  body {

    margin: 0;
    padding: 20px;
    text-align: center;
  }
  h1 {

    font-size: 28px;
    margin-bottom: 4px;

    font-size: 14px;

    margin-bottom: 16px;
  }

    border: none;
    border-radius: 999px;
    padding: 8px 24px;
    font-size: 14px;
    cursor: pointer;
  }

    border-radius: 16px;
    padding: 12px 8px 14px;
    cursor: pointer;

    user-select: none;
  }
  .card:hover {
    transform: translateY(-3px);
    border-color: #a8d8b8;
  }
  .card.playing {
    border-color: #5cb37c;
    box-shadow: 0 0 0 4px rgba(92,179,124,0.18);
  }
  .card img {
    width: 100%;
    max-width: 110px;
    height: 110px;
    object-fit: contain;
    display: block;
    margin: 0 auto 8px;
  }
  .hira {
    font-size: 16px;
    font-weight: 700;
    color: #333;
    visibility: hidden;
  }
  .zh {
    font-size: 13px;
    color: #999;
    margin-top: 2px;
  }
  .card.revealed .hira {
    visibility: visible;
  }
</style>

const g = document.getElementById('grid');
DATA.forEach(item => {
  const c = document.createElement('div');
  c.className = 'card';
  c.innerHTML = `<img src="${item.img}" alt="${item.hira}"><div class="hira">${item.hira}</div><div class="zh">${item.zh}</div>`;
  const a = new Audio(item.wav);
  c.addEventListener('click', () => {
    c.classList.add('playing', 'revealed');
    a.currentTime = 0;
    a.play();
    a.onended = () => c.classList.remove('playing');
  });
  g.appendChild(c);
});
function reset() {
  document.querySelectorAll('.card').forEach(c => c.classList.remove('playing', 'revealed'));
}
