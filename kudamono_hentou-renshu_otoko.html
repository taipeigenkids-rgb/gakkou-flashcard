<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>かいわ れんしゅう｜くだもの 返答練習</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Hiragino Kaku Gothic ProN','Noto Sans JP',-apple-system,sans-serif; background: #fff8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 12px; }
.wrap { width: 100%; max-width: 420px; }
.start-screen { text-align: center; background: #fff; border-radius: 20px; padding: 2rem 1.5rem; border: 2px solid #ffd580; }
.start-chars { display: flex; justify-content: center; gap: 24px; margin-bottom: 12px; align-items: flex-end; }
.start-chars img { height: 85px; object-fit: contain; }
.start-title { font-size: 22px; font-weight: 700; color: #333; margin-bottom: 4px; }
.start-sub { font-size: 13px; color: #888; margin-bottom: 1.2rem; }
.start-info { background: #fff8f0; border-radius: 12px; padding: 12px 16px; margin-bottom: 1.5rem; text-align: left; font-size: 14px; color: #555; line-height: 1.8; }
.start-btn { background: #f9a825; color: #fff; border: none; border-radius: 14px; padding: 16px; font-size: 18px; font-weight: 700; cursor: pointer; font-family: inherit; width: 100%; }
.main { display: none; }
.prog-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.prog-bar { flex: 1; height: 6px; background: #fde8a0; border-radius: 4px; }
.prog-fill { height: 100%; background: #f9a825; border-radius: 4px; transition: width 0.4s; }
.counter { font-size: 13px; color: #aaa; white-space: nowrap; }
.card { background: #fff; border-radius: 20px; border: 2px solid #ffd580; padding: 16px; min-height: 340px; transition: opacity 0.2s; }
.card.fade { opacity: 0; }
.section-tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 12px; border-radius: 999px; margin-bottom: 12px; background: #fde8a0; color: #c77000; }
.scene { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 14px; }
.char { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 68px; }
.char img { height: 80px; object-fit: contain; }
.char-label { font-size: 11px; color: #aaa; }
.bubble { border: 2px solid #f9a825; border-radius: 14px; padding: 12px 14px; background: #fffef8; flex: 1; position: relative; }
.bubble.left::before { content:''; position:absolute; left:-12px; top:20px; border:6px solid transparent; border-right-color:#f9a825; }
.bubble-jp { font-size: 17px; font-weight: 700; color: #333; line-height: 1.6; }
.bubble-zh { font-size: 13px; color: #f9a825; margin-top: 3px; }
.answer-scene { display: flex; gap: 10px; align-items: flex-start; }
.answer-bubble { border: 2px dashed #ffd580; border-radius: 14px; padding: 12px 14px; background: #fffef8; flex: 1; position: relative; cursor: pointer; min-height: 70px; display: flex; flex-direction: column; justify-content: center; transition: background 0.2s; }
.answer-bubble.right::before { content:''; position:absolute; right:-12px; top:20px; border:6px solid transparent; border-left-color:#ffd580; }
.answer-bubble.revealed { border: 2px solid #f9a825; background: #fff8f0; }
.answer-bubble.revealed::before { border-left-color:#f9a825; }
.tap-hint { font-size: 13px; color: #ccc; text-align: center; }
.answer-jp { font-size: 17px; font-weight: 700; color: #333; display: none; line-height: 1.6; }
.answer-zh { font-size: 13px; color: #f9a825; margin-top: 3px; display: block; }
.revealed .tap-hint { display: none; }
.revealed .answer-jp { display: block; }
.speak-row { display: flex; justify-content: center; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.speak-btn { background: #fff8f0; border: 1.5px solid #f9a825; border-radius: 999px; padding: 6px 14px; font-size: 13px; cursor: pointer; color: #c77000; font-family: inherit; font-weight: 600; display: none; }
.controls { display: flex; gap: 8px; margin-top: 12px; align-items: center; }
.ctrl-btn { background: #fff; border: 1.5px solid #ffd580; border-radius: 12px; padding: 10px 16px; font-size: 15px; cursor: pointer; font-family: inherit; color: #555; }
.ctrl-btn:disabled { opacity: 0.3; cursor: default; }
.next-btn-big { flex: 1; background: #f9a825; color: #fff; border: none; border-radius: 12px; padding: 12px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; }
.speed-row { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 8px; font-size: 12px; color: #aaa; }
.speed-row select { font-size: 12px; padding: 4px 8px; border-radius: 8px; border: 1px solid #ffd580; background: #fff; font-family: inherit; }
.done-screen { display: none; text-align: center; background: #fff; border-radius: 20px; padding: 2rem 1.5rem; border: 2px solid #ffd580; }
.done-screen .big { font-size: 52px; margin-bottom: 8px; }
.done-screen h2 { font-size: 20px; font-weight: 700; margin-bottom: 8px; color: #333; }
.done-screen p { font-size: 14px; color: #888; margin-bottom: 1.5rem; }
.restart-btn { background: #f9a825; color: #fff; border: none; border-radius: 14px; padding: 14px; font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit; width: 100%; }
</style>
</head>
<body>
<div class="wrap">
<div class="start-screen" id="start">
  <div class="start-chars">
    <img id="si" alt="せんせい">
    <img id="ri" alt="りんたろう">
  </div>
  <div class="start-title">🍇 くだもの　返答練習</div>
  <div class="start-sub">水果について答えよう！</div>
  <div class="start-info">
    ① せんせいの　しつもんを　きく<br>
    ② こたえを　かんがえる<br>
    ③ タップして　こたえを　みる<br>
    ④ こえに　だして　いう　🗣️
  </div>
  <button class="start-btn" onclick="startApp()">▶ はじめる</button>
</div>
<div class="main" id="main">
  <div class="prog-row">
    <div class="prog-bar"><div class="prog-fill" id="prog" style="width:33%"></div></div>
    <div class="counter" id="counter">1 / 3</div>
  </div>
  <div class="card" id="card">
    <div class="section-tag">🍇 くだもの</div>
    <div class="scene" id="q-scene"></div>
    <div class="answer-scene" id="a-scene"></div>
    <div class="speak-row" id="speak-row"></div>
    <div class="controls">
      <button class="ctrl-btn" id="prev-btn" onclick="prev()" disabled>◀</button>
      <button class="next-btn-big" onclick="next()">つぎへ ▶</button>
    </div>
    <div class="speed-row">
      速度：<select id="speed" onchange="setSpeed(this.value)">
        <option value="0.75">遅い</option>
        <option value="1" selected>ふつう</option>
        <option value="1.25">速い</option>
      </select>
    </div>
  </div>
</div>
<div class="done-screen" id="done">
  <div class="big">🎉</div>
  <h2>おわり！</h2>
  <p>ぜんぶ　れんしゅうしたね！<br>全部練習完了！</p>
  <button class="restart-btn" onclick="restart()">🔄 もういちど</button>
</div>
</div>

    document.getElementById('counter').textContent=(i+1)+' / '+cards.length;
    document.getElementById('prev-btn').disabled=i===0;
    document.getElementById('q-scene').innerHTML='<div class="char"><img src="'+SENSEI_IMG+'" alt="せんせい"><div class="char-label">せんせい</div></div><div class="bubble left"><div class="bubble-jp">'+c.q+'</div><div class="bubble-zh">'+c.qzh+'</div></div>';
    document.getElementById('a-scene').innerHTML='<div class="answer-bubble right" id="ans-bubble" onclick="revealAnswer('+i+')"><div class="tap-hint">👆 タップして　こたえを　みる</div><div class="answer-jp">'+c.a+'</div><div class="answer-zh">'+c.azh+'</div></div><div class="char"><img src="'+RINTA_IMG+'" alt="りんたろう"><div class="char-label">りんたろう</div></div>';
    document.getElementById('speak-row').innerHTML='<button class="speak-btn" onclick="playAudio(Q_AUDIO['+i+'])">🔊 しつもん</button><button class="speak-btn" onclick="playAudio(A_AUDIO['+i+'])">🔊 こたえ</button>';
    playAudio(Q_AUDIO[i]);
    card.classList.remove('fade');
  },200);
}
function revealAnswer(i){const b=document.getElementById('ans-bubble');if(b.classList.contains('revealed'))return;b.classList.add('revealed');document.querySelectorAll('.speak-btn').forEach(x=>x.style.display='inline-block');setTimeout(()=>playAudio(A_AUDIO[i]),300);}
function next(){if(current<cards.length-1){current++;show(current);}else{document.getElementById('main').style.display='none';document.getElementById('done').style.display='block';}}
function prev(){if(current>0){current--;show(current);}}
function restart(){current=0;document.getElementById('done').style.display='none';document.getElementById('main').style.display='block';show(0);}
</script>
</body>
</html>
