<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>からだ フラッシュカード</title>
<style>
  body {
    font-family: "UD Digi Kyokasho NK-R", "BIZ UDPGothic", sans-serif;
    background: #fefcf6;
    margin: 0;
    padding: 16px;
    text-align: center;
  }
  h1 {
    font-size: 24px;
    color: #444;
    margin-bottom: 4px;
  }
  .controls {
    margin: 10px 0 16px;
  }
  button#resetBtn {
    background: #f0a23c;
    color: #fff;
    border: none;
    border-radius: 20px;
    padding: 8px 24px;
    font-size: 15px;
    cursor: pointer;
  }
  p.instruction {
    color: #777;
    font-size: 14px;
    margin: 4px 0 16px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 16px;
    max-width: 900px;
    margin: 0 auto;
  }
  .card {
    background: #fff;
    border: 2px solid #eee;
    border-radius: 16px;
    padding: 12px 8px 14px;
    cursor: pointer;
    transition: transform 0.12s, border-color 0.12s, box-shadow 0.12s;
    user-select: none;
  }
  .card:hover {
    transform: translateY(-3px);
    border-color: #f0c789;
  }
  .card:active {
    transform: scale(0.97);
  }
  .card.playing {
    border-color: #f0a23c;
    box-shadow: 0 0 0 4px rgba(240,162,60,0.18);
  }
  .card img {
    width: 100%;
    max-width: 110px;
    height: 110px;
    object-fit: contain;
    display: block;
    margin: 0 auto 8px;
  }
  .hira {
    font-size: 16px;
    font-weight: 700;
    color: #333;
    visibility: hidden;
  }
  .zh {
    font-size: 13px;
    color: #999;
    margin-top: 2px;
  }
  .card.revealed .hira {
    visibility: visible;
  }
</style>
</head>

const g = document.getElementById('grid');
DATA.forEach(item => {
  const c = document.createElement('div');
  c.className = 'card';
  c.innerHTML = `<img src="${item.img}" alt="${item.hira}"><div class="hira">${item.hira}</div><div class="zh">${item.zh}</div>`;
  const a = new Audio(item.wav);
  c.addEventListener('click', () => {
    c.classList.add('playing', 'revealed');
    a.currentTime = 0;
    a.play();
    a.onended = () => c.classList.remove('playing');
  });
  g.appendChild(c);
});
function reset(){
  document.querySelectorAll('.card').forEach(c => c.classList.remove('playing', 'revealed'));
