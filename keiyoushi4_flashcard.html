<style>
  * { box-sizing: border-box; }

    border-color: #5cb37c;

    width: 100%;
    max-width: 110px;
    height: 110px;
    object-fit: contain;
    display: block;
    margin: 0 auto 8px;

  .hira {
    font-size: 16px;
    font-weight: 700;
    color: #333;
    visibility: hidden;
  }
  .zh {
    font-size: 13px;
    color: #999;
    margin-top: 2px;
  }
  .card.revealed .hira {
    visibility: visible;
  }
</style>

const g = document.getElementById('grid');
DATA.forEach(item => {
  const c = document.createElement('div');
  c.className = 'card';
  c.innerHTML = `<img src="${item.img}" alt="${item.hira}"><div class="hira">${item.hira}</div><div class="zh">${item.zh}</div>`;
  const a = new Audio(item.wav);
  c.addEventListener('click', () => {
    c.classList.add('playing', 'revealed');
    a.currentTime = 0;
    a.play();
    a.onended = () => c.classList.remove('playing');
  });
  g.appendChild(c);
});
function reset() {
  document.querySelectorAll('.card').forEach(c => c.classList.remove('playing', 'revealed'));
}
