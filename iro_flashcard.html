<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>いろ フラッシュカード</title>
<style>
body{font-family:sans-serif;background:#f5f5f5;margin:0;padding:16px;}
h1{font-size:18px;font-weight:500;margin:0 0 4px;color:#222;}
p{font-size:13px;color:#888;margin:0 0 12px;}
.top{display:flex;align-items:center;gap:10px;margin-bottom:4px;}
button.reset{font-size:12px;padding:5px 14px;border:1px solid #ccc;border-radius:8px;background:#fff;cursor:pointer;color:#555;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;}
.card{background:#fff;border:2px solid #e0e0e0;border-radius:14px;cursor:pointer;padding:14px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform 0.12s,border-color 0.12s;min-height:160px;justify-content:center;-webkit-tap-highlight-color:transparent;}
.card:hover{border-color:#aaa;transform:translateY(-2px);}
.card.playing{border-color:#1D9E75;box-shadow:0 0 0 3px rgba(29,158,117,0.2);}
.card img{width:80px;height:80px;object-fit:contain;}
.labels{display:flex;flex-direction:column;align-items:center;gap:3px;opacity:0;transform:translateY(5px);transition:opacity 0.18s,transform 0.18s;}
.card.revealed .labels{opacity:1;transform:translateY(0);}
.hira{font-size:13px;font-weight:700;color:#222;text-align:center;}
.zh{font-size:12px;color:#888;text-align:center;}
</style>
</head>
<body>
<div class="top"><h1>いろ　顔色</h1><button class="reset" onclick="reset()">リセット</button></div>
<p>カードをクリックすると文字表示＋音声読み上げ</p>
<div class="grid" id="grid"></div>
<script>
const BASE = "https://taipeigenkids-rgb.github.io/gakkou-flashcard/";
const DATA = [
  {hira:"しろ",   zh:"白色",   img:"白.gif",   wav:"001_ずんだもん_ノーマル__しろ.wav"},
  {hira:"くろ",   zh:"黑色",   img:"黒.gif",   wav:"002_ずんだもん_ノーマル__くろ.wav"},
  {hira:"あか",   zh:"紅色",   img:"赤.gif",   wav:"003_ずんだもん_ノーマル__あか.wav"},
  {hira:"あお",   zh:"藍色",   img:"青.gif",   wav:"004_ずんだもん_ノーマル__あお.wav"},
  {hira:"みどり", zh:"綠色",   img:"緑.gif",   wav:"005_ずんだもん_ノーマル__みどり.wav"},
  {hira:"ちゃいろ",zh:"咖啡色",img:"茶色.gif", wav:"006_ずんだもん_ノーマル__ちゃいろ.wav"},
  {hira:"きいろ", zh:"黃色",   img:"黄色.gif", wav:"007_ずんだもん_ノーマル__きいろ.wav"},
  {hira:"むらさき",zh:"紫色",  img:"紫.gif",   wav:"008_ずんだもん_ノーマル__むらさき.wav"},
  {hira:"グレー", zh:"灰色",   img:"グレー.gif",wav:"009_ずんだもん_ノーマル__グレー.wav"},
  {hira:"ピンク", zh:"粉紅色", img:"ピンク.gif",wav:"010_ずんだもん_ノーマル__ピンク.wav"},
  {hira:"オレンジ",zh:"橘色",  img:"オレンジ.gif",wav:"011_ずんだもん_ノーマル__オレンジ.wav"},
];
const g = document.getElementById('grid');
DATA.forEach(item => {
  const c = document.createElement('div');
  c.className = 'card';
  c.innerHTML = `<img src="${BASE}${encodeURIComponent(item.img)}" alt="${item.hira}"><div class="labels"><div class="hira">${item.hira}</div><div class="zh">${item.zh}</div></div>`;
  c.addEventListener('click', () => {
    c.classList.add('revealed','playing');
    const a = new Audio(BASE + encodeURIComponent(item.wav));
    a.play();
    a.onended = () => c.classList.remove('playing');
  });
  g.appendChild(c);
});
function reset(){document.querySelectorAll('.card').forEach(c=>c.classList.remove('revealed','playing'));}
</script>
</body>
</html>
