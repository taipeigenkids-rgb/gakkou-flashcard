<style>
  * { box-sizing: border-box; }
  body {

    background: #f5faf5;
    margin: 0;
    padding: 20px;
    text-align: center;
  }
  h1 {
    color: #3a5a4a;
    font-size: 28px;
    margin-bottom: 4px;
  }
  .instruction {
    color: #999;
    font-size: 14px;
    margin-bottom: 16px;
  }
  .controls {
    margin-bottom: 16px;
  }
  .controls button {
    background: #5cb37c;
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 8px 24px;
    font-size: 14px;
    cursor: pointer;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 14px;
    max-width: 700px;
    margin: 0 auto;
  }
  .card {
    background: #fff;
    border: 2px solid #e6f0e8;
    border-radius: 16px;
    padding: 12px 8px 14px;
    cursor: pointer;
    transition: transform 0.12s, border-color 0.12s, box-shadow 0.12s;
    user-select: none;
  }
  .card:hover {
    transform: translateY(-3px);
    border-color: #a8d8b8;
  }
  .card.playing {
    border-color: #5cb37c;
    box-shadow: 0 0 0 4px rgba(92,179,124,0.18);
  }
  .card img {
    width: 100%;
    max-width: 110px;
    height: 110px;
    object-fit: contain;
    display: block;
    margin: 0 auto 8px;
  }
  .hira {
    font-size: 16px;
    font-weight: 700;
    color: #333;
    visibility: hidden;
  }
  .zh {
    font-size: 13px;
    color: #999;
    margin-top: 2px;
  }
  .card.revealed .hira {
    visibility: visible;
  }
</style>
</head>

    a.currentTime = 0;
    a.play();
    a.onended = () => c.classList.remove('playing');
  });
  g.appendChild(c);
});
function reset() {
  document.querySelectorAll('.card').forEach(c => c.classList.remove('playing', 'revealed'));
}
</script>
</body>
</html>
