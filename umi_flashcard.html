<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>うみのなか</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Hiragino Maru Gothic Pro", "Yu Gothic", sans-serif;
    background: #f0f9fc;
    margin: 0;
    padding: 20px;
    text-align: center;
  }
  h1 {
    color: #2a5a78;
    font-size: 28px;
    margin-bottom: 4px;
  }
  .instruction {
    color: #999;
    font-size: 14px;
    margin-bottom: 16px;
  }
  .controls {
    margin-bottom: 16px;
  }
  .controls button {
    background: #4aa3c7;
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 8px 24px;
    font-size: 14px;
    cursor: pointer;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 14px;
    max-width: 700px;
    margin: 0 auto;
  }
  .card {
    background: #fff;
    border: 2px solid #e2eef3;
    border-radius: 16px;
    padding: 12px 8px 14px;
    cursor: pointer;
    transition: transform 0.12s, border-color 0.12s, box-shadow 0.12s;
    user-select: none;
  }
  .card:hover {
    transform: translateY(-3px);
    border-color: #a8d8eb;
  }
  .card:active {
    transform: scale(0.97);
  }
  .card.playing {
    border-color: #4aa3c7;
    box-shadow: 0 0 0 4px rgba(74,163,199,0.18);
  }
  .card img {
    width: 100%;
    max-width: 110px;
    height: 110px;
    object-fit: contain;
    display: block;
    margin: 0 auto 8px;
  }
  .hira {
    font-size: 16px;
    font-weight: 700;
    color: #333;
    visibility: hidden;
  }
  .zh {
    font-size: 13px;
    color: #999;
    margin-top: 2px;
  }
  .card.revealed .hira {
    visibility: visible;
  }
</style>
</head>
