<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>かいわ れんしゅう｜フラッシュカード</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Hiragino Kaku Gothic ProN','Noto Sans JP',-apple-system,sans-serif; background: #fff8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 12px; }
.wrap { width: 100%; max-width: 420px; }
.start-screen { text-align: center; background: #fff; border-radius: 20px; padding: 2rem 1.5rem; border: 2px solid #ffd580; }
.start-chars { display: flex; justify-content: center; gap: 12px; margin-bottom: 12px; align-items: flex-end; }
.start-chars img { height: 80px; object-fit: contain; background: white; border-radius: 8px; padding: 4px; }
.start-title { font-size: 22px; font-weight: 700; color: #333; margin-bottom: 4px; }
.start-sub { font-size: 13px; color: #888; margin-bottom: 1.2rem; }
.start-topics { background: #fff8f0; border-radius: 12px; padding: 12px 16px; margin-bottom: 1.5rem; text-align: left; }
.start-topics p { font-size: 14px; color: #555; margin-bottom: 4px; }
.start-btn { background: #f9a825; color: #fff; border: none; border-radius: 14px; padding: 16px; font-size: 18px; font-weight: 700; cursor: pointer; font-family: inherit; width: 100%; }
.start-btn:active { transform: scale(0.97); }
.main { display: none; }
.prog-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.prog-bar { flex: 1; height: 6px; background: #fde8a0; border-radius: 4px; }
.prog-fill { height: 100%; background: #f9a825; border-radius: 4px; transition: width 0.4s; }
.counter { font-size: 13px; color: #aaa; white-space: nowrap; }
.card { background: #fff; border-radius: 20px; border: 2px solid #ffd580; padding: 16px; min-height: 330px; position: relative; transition: opacity 0.2s; }
.card.fade { opacity: 0; }
.section-tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 12px; border-radius: 999px; margin-bottom: 10px; }
.scene { display: flex; align-items: flex-end; justify-content: space-between; gap: 6px; min-height: 190px; margin-bottom: 8px; }
.char { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 70px; }
.char img { height: 90px; object-fit: contain; background: white; border-radius: 8px; padding: 4px; }
.char-label { font-size: 11px; color: #888; }
.bubble-wrap { flex: 1; display: flex; flex-direction: column; gap: 10px; justify-content: center; }
.bubble { border: 2px solid #f9a825; border-radius: 14px; padding: 10px 12px; background: #fffef8; position: relative; }
.bubble.left::before { content:''; position:absolute; left:-12px; top:50%; transform:translateY(-50%); border:6px solid transparent; border-right-color:#f9a825; }
.bubble.right::before { content:''; position:absolute; right:-12px; top:50%; transform:translateY(-50%); border:6px solid transparent; border-left-color:#f9a825; }
.bubble-jp { font-size: 16px; font-weight: 700; color: #333; line-height: 1.5; }
.bubble-zh { font-size: 13px; color: #f9a825; margin-top: 3px; }
.speak-row { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
.speak-btn { background: #fff8f0; border: 1.5px solid #f9a825; border-radius: 999px; padding: 6px 14px; font-size: 13px; cursor: pointer; color: #c77000; font-family: inherit; font-weight: 600; }
.speak-btn:active { background: #fde8a0; }
.controls { display: flex; gap: 8px; margin-top: 12px; align-items: center; }
.ctrl-btn { background: #fff; border: 1.5px solid #ffd580; border-radius: 12px; padding: 10px 16px; font-size: 15px; cursor: pointer; font-family: inherit; color: #555; }
.ctrl-btn:active { background: #fff8f0; }
.ctrl-btn:disabled { opacity: 0.3; cursor: default; }
.play-btn { flex: 1; background: #f9a825; color: #fff; border: none; border-radius: 12px; padding: 12px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; }
.play-btn:active { background: #ef8f00; }
.speed-row { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 8px; font-size: 12px; color: #aaa; }
.speed-row select { font-size: 12px; padding: 4px 8px; border-radius: 8px; border: 1px solid #ffd580; background: #fff; font-family: inherit; }
.voice-note { text-align: center; font-size: 11px; color: #ccc; margin-top: 6px; }
.done-screen { display: none; text-align: center; background: #fff; border-radius: 20px; padding: 2rem 1.5rem; border: 2px solid #ffd580; }
.done-screen .big { font-size: 48px; margin-bottom: 8px; }
.done-screen h2 { font-size: 20px; font-weight: 700; margin-bottom: 6px; color: #333; }
.done-screen p { font-size: 14px; color: #888; margin-bottom: 1.5rem; }
.restart-btn { background: #f9a825; color: #fff; border: none; border-radius: 14px; padding: 14px; font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit; width: 100%; }
</style>
</head>

let current=0, playing=false, speakRate=0.9, jpVoice=null;

function loadVoice() {
  const vs = speechSynthesis.getVoices();
  jpVoice = vs.find(v=>v.lang==='ja-JP') || vs.find(v=>v.lang.startsWith('ja')) || null;
  const n = document.getElementById('voice-note');
  if (n && jpVoice) n.textContent = '🔊 ' + jpVoice.name;
}
speechSynthesis.onvoiceschanged = loadVoice;
loadVoice();

function startApp() {
  document.getElementById('start').style.display = 'none';
  document.getElementById('main').style.display = 'block';
  speechSynthesis.speak(new SpeechSynthesisUtterance(''));
  show(0);
}

function charImg(who) {
  return '<img src="' + IMGS[who] + '" alt="' + LABELS[who] + '" style="height:90px;object-fit:contain;">';
}

function show(i, doSpeak=true, onEnd=null) {
  const card = document.getElementById('card');
  card.classList.add('fade');
  setTimeout(() => {
    const c = cards[i];
    document.getElementById('prog').style.width = ((i+1)/cards.length*100)+'%';
    document.getElementById('counter').textContent = (i+1)+' / '+cards.length;
    const tag = document.getElementById('sec-tag');
    tag.textContent = c.section==='じこしょうかい' ? '👤 じこしょうかい' : c.section==='かぞく' ? '👨‍👩‍👧 かぞく' : '🌟 ふくごうれんしゅう';
    tag.style.background = c.sc; tag.style.color = c.stc;
    document.getElementById('prev-btn').disabled = i===0;
    document.getElementById('next-btn').disabled = i===cards.length-1;

    document.getElementById('scene').innerHTML =
      '<div class="char">'+charImg(c.qs)+'<div class="char-label">'+LABELS[c.qs]+'</div></div>'+
      '<div class="bubble-wrap">'+
        '<div class="bubble left"><div class="bubble-jp">'+c.q+'</div><div class="bubble-zh">'+c.qzh+'</div></div>'+
        '<div class="bubble right"><div class="bubble-jp">'+c.a+'</div><div class="bubble-zh">'+c.azh+'</div></div>'+
      '</div>'+
      '<div class="char">'+charImg(c.as)+'<div class="char-label">'+LABELS[c.as]+'</div></div>';

    document.getElementById('speak-row').innerHTML =
      '<button class="speak-btn" onclick="speakLine(cards['+i+'].q)">🔊 しつもん</button>'+
      '<button class="speak-btn" onclick="speakLine(cards['+i+'].a)">🔊 こたえ</button>'+
      '<button class="speak-btn" onclick="speakBoth('+i+')">🔊 りょうほう</button>';

    card.classList.remove('fade');
    if (doSpeak) speakBoth(i, onEnd);
    else if (onEnd) onEnd();
  }, 200);
}

function speakLine(text, cb) {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang='ja-JP'; u.rate=speakRate;
  if (jpVoice) u.voice=jpVoice;
  if (cb) u.onend=cb;
  speechSynthesis.speak(u);
}

function speakBoth(i, cb) {
  const c = cards[i];
  speechSynthesis.cancel();
  const u1 = new SpeechSynthesisUtterance(c.q);
  u1.lang='ja-JP'; u1.rate=speakRate;
  if (jpVoice) u1.voice=jpVoice;
  u1.onend = () => setTimeout(() => {
    const u2 = new SpeechSynthesisUtterance(c.a);
    u2.lang='ja-JP'; u2.rate=speakRate;
    if (jpVoice) u2.voice=jpVoice;
    if (cb) u2.onend=cb;
    speechSynthesis.speak(u2);
  }, 600);
  speechSynthesis.speak(u1);
}

function next() { if(current<cards.length-1){current++;show(current);}else{stopPlay();showDone();} }
function prev() { if(current>0){current--;show(current);} }
function togglePlay() { playing ? stopPlay() : startPlay(); }
function startPlay() {
  playing=true;
  document.getElementById('play-btn').textContent='⏸ いちじていし';
  if(current>=cards.length-1) current=0;
  playCard(current);
}
function playCard(i) {
  if(!playing) return;
  current=i;
  show(i, true, () => {
    if(!playing) return;
    setTimeout(()=>{
      if(!playing) return;
      if(current<cards.length-1) playCard(current+1);
      else { stopPlay(); showDone(); }
    }, 1200);
  });
}
function stopPlay() {
  playing=false; speechSynthesis.cancel();
  document.getElementById('play-btn').textContent='▶ じどうさいせい';
}
function changeSpeed() {
  speakRate=parseFloat(document.getElementById('speed-sel').value);
  if(playing){stopPlay();startPlay();}
}
function showDone() {
  document.getElementById('main').style.display='none';
  document.getElementById('done').style.display='block';
}
function restart() {
  current=0; playing=false;
  document.getElementById('done').style.display='none';
  document.getElementById('main').style.display='block';
  show(0);
}
</script>
</body>
</html>
